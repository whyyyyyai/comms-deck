# warp-core live mods. Save this file and the running warp core picks it up
# within half a second: no rebuild, no restart. If something here doesn't
# parse, the warp core keeps the last good version and says why in the HUD.
#
# Colours are linear [r, g, b]; values above 1 bloom. In rules a colour can
# also be a name: white red amber gold green cyan blue violet pink, or "seat"
# for the seat's own colour.

[look]
background = [0.01, 0.012, 0.03]
bloom = 0.28
fps = 30                      # frames a second; lower sips less power
fps_unfocused = 20            # while another window has the focus

[core]
cool = [0.25, 0.9, 3.2]       # the core's colour when the crew has room
hot = [5.0, 2.2, 0.8]         # ... and as their meters fill up
size = 1.0
breath = 0.07                 # how far it swells each breath
ring_spin = 1.0               # containment ring speed

# The ring's spin comes from the agents' notes to each other: each one
# kicks it in the direction it travels round the ring, and it slows to a
# stop without them.
[orbit]
drift = 0.0                   # a steady turn on top (radians a second)
traffic = 0.0                 # (old) per note in the last 10 minutes
warp_swing = 1.2              # added at full warp
spin_kick = 0.08              # spin one note between agents adds
friction = 0.12               # spin lost per second, proportionally
max_spin = 1.5

# The stars' speed comes from the agents: still when nobody is working,
# slow with a few at it, a boost when an agent writes to Y.
[stars]
speed = 0                     # with nobody working
per_busy = 7                  # added per agent at work
boost_per_note = 0.4          # an agent's note to Y
boost_speed = 160             # speed at a boost of 1
boost_decay = 0.3             # boost lost per second
warp_speed = 900
stretch = 40
colour = [0.9, 0.95, 1.4]       # used when by_context is off, or nobody reports context
by_context = true               # each seat gets its share of the stars, in its colour
context_bright = 1.6

[comets]
seconds = 1.8
trail = 28
brightness = 5
size = 1.0

[warp]
decay = 0.22                  # warp lost per second
on_broadcast = 1.0            # warp a note to `all` kicks in (0 turns it off)

[seats]
size = 1.0
other = 0.22                  # away, not set up, paused
[seats.brightness]
busy = 3.2
stuck = 2.0
ready = 1.1
idle = 1.1
spent = 0.35

# Fuel rings: context (inner), 5-hour (middle), week (outer), from the
# seats' usage files. A seat with no usage file has none.
[fuel]
show = true
warn = 70
danger = 90
ok_colour = [0.2, 1.3, 0.55]
warn_colour = [1.8, 1.0, 0.1]
danger_colour = [3.0, 0.25, 0.15]
empty = 0.08

# Backlog moons: one per waiting note, white when fresh, red by old_hours.
[moons]
show = true
max = 24
fresh = [1.2, 1.2, 1.3]
old = [2.5, 0.25, 0.1]
old_hours = 6
speed = 0.6

[hud]
show = true
dock = true                   # the line of seats that aren't on the ring
hover_card = false            # the seat card under the pointer (off for now)

# The load balancer's task board, read live from ~/.local/share/comms-deck/.
# Open tasks orbit the core on their own ring; a held task is a bolt from its
# holder to the core. Both are coloured by the seat that assigned the task
# (Y's tasks burn gold), and t toggles the whole thing.
[tasks]
show = true
speed = 0.22                  # radians a second the task ring turns
radius = 0.42                 # the ring's radius, as a share of the seat ring's
size = 0.5
bright = 1.1
bolt_bright = 0.5

# The chat panel on the right: the notes, and a chat box that sends as Y.
# The terminal chat screen keeps working alongside it.
[chat]
show = true
width = 0.32                  # share of the window (300..600 px)
font = 14
keep = 200                    # notes kept for scrolling back

# Typing in the chat box builds thrust: the longer the note, the faster the
# stars stream. It drains away when you stop; sending jumps to warp.
[typing]
kick = 0.02                   # thrust per key (thrust runs 0..1)
decay = 0.05                  # thrust lost per second
star_speed = 420              # added star speed at full thrust
stretch = 14                  # added streaking at full thrust
jump_on_send = true
jump_per_char = 0.004         # warp per character sent: 250 characters = full warp
jump_max = 2.0                # the biggest jump (a 500-character note); warp drains
                              # at [warp] decay a second, so longer notes coast longer

# Stars that reach the edge splash against it: their light soaks into a
# subtle glow along the border that spreads a little and fades.
[splash]
show = true
energy = 0.12                 # light one star leaves on the wall
fade = 0.7                    # glow lost per second (proportionally)
spread = 1.5                  # how fast it spreads along the wall
spill = 2                     # neighbouring cells a splash reaches at once
cells = 64                    # cells per edge
glow = 1.0                    # on-screen brightness; above 1 blooms

# Conduits from the planets to the core bend with the ring's spin, and send a
# packet of light only when a job is finished.
[conduits]
bend = 2.2                    # bend per radian a second of spin
max_bend = 1.4
packet_seconds = 1.4

# Inside each planet (mods/shaders/planet.wgsl): calm idle, churning busy,
# more the longer it has been working.
[planets]
show = true
full_minutes = 20

# ---------------------------------------------------------------- rules
#
# on = "seat": `when` is checked every frame for each seat on the ring.
#   effects: halo (a ring around it: colour, pulse, size, bright)
#            tint (its colour: colour, bright)
#            glow (brightness times `bright`)
#            beacon (a flashing marker above it: colour, pulse)
#            label (adds `text` under its name)
#   fields:  name state shown online busy idle ready stuck spent waiting
#            waiting_normal oldest_waiting_s oldest_waiting_h since_s
#            held_by_draft paused ctx five_hour week fullest has_usage focused
#            (ctx / five_hour / week / fullest are percentages, -1 if unknown)
#
# on = "note": checked once for each note as it flies.
#   effects: comet (colour, size, bright, seconds)
#            warp (kicks the starfield by `strength`)
#            shockwave (a ring bursts from the receiver: colour, size)
#   fields:  from to all to_owner to_count quiet len
#            (`to` is a comma list: to contains 'vibe')
#
# The language: numbers, 'strings', true/false, + - * /,
# == != < <= > >=, && || ! (or and/or/not), and ( ).

[[rule]]
on = "seat"
when = "oldest_waiting_h >= 1"
effect = "halo"
colour = "amber"
pulse = 1.0

[[rule]]
on = "seat"
when = "fullest >= 90"
effect = "beacon"
colour = "red"
pulse = 2.0

[[rule]]
on = "seat"
when = "held_by_draft"
effect = "label"
text = "drafting..."

# Stuck, and something other than quiet notes is waiting: the deck calls a
# seat stuck for a quiet FYI too, which isn't meant to wake it.
[[rule]]
on = "seat"
when = "stuck && waiting_normal > 0"
effect = "halo"
colour = "red"
pulse = 2.5
size = 1.15

[[rule]]
on = "note"
when = "to_owner"
effect = "comet"
colour = "gold"
size = 1.8
bright = 1.5

[[rule]]
on = "note"
when = "to_owner"
effect = "shockwave"
colour = "gold"

[[rule]]
on = "note"
when = "len > 1500"
effect = "comet"
size = 1.6
